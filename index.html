<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Acelis Pay</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: radial-gradient(circle at top right, #0b1528, #030712); 
            color: white; 
        }
        
        /* Glassmorphism Premium Card */
        .admin-card { 
            background: rgba(15, 23, 42, 0.45); 
            backdrop-filter: blur(16px); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            border-radius: 1.5rem; 
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }
        
        /* Modern Colored Input Fields */
        .input-field { 
            background: rgba(15, 23, 42, 0.6); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 0.75rem; 
            padding: 0.85rem 1rem; 
            width: 100%; 
            outline: none; 
            color: white; 
            font-size: 14px; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .input-field:focus { 
            border-color: #3b82f6; 
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.15);
            background: rgba(15, 23, 42, 0.8);
        }
        
        /* Sleek Product Card Preview - Professional Design */
        .product-card-preview { 
            background: rgba(15, 23, 42, 0.4); 
            backdrop-filter: blur(8px);
            border-radius: 16px; 
            overflow: hidden; 
            border: 1px solid rgba(255, 255, 255, 0.06); 
            position: relative; 
            width: 100%; 
            display: flex;
            flex-direction: column;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .product-card-preview:hover {
            transform: translateY(-6px);
            border-color: rgba(59, 130, 246, 0.4);
            box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.7), 0 0 20px 0 rgba(59, 130, 246, 0.1);
        }
        
        /* Full Size Product Image adjustments */
        .stok-img-wrapper { 
            position: relative; 
            width: 100%; 
            overflow: hidden; 
            height: auto;
            display: block;
        }
        .stok-img { 
            width: 100%; 
            height: auto; 
            object-fit: contain; 
            display: block; 
            transition: all 0.5s ease; 
        }
        .stok-info { 
            padding: 16px; 
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .stok-title { 
            font-weight: 700; 
            font-size: 15px; 
            color: #f1f5f9; 
            line-height: 1.4; 
            margin-bottom: 4px; 
            text-transform: uppercase; 
            letter-spacing: 0.5px; 
            width: 100%;
        }
        .stok-price { 
            color: #60a5fa; 
            font-weight: 800; 
            font-size: 17px; 
            display: block; 
            margin-bottom: 12px; 
        }
        
        /* Vibrant Badges */
        .badge-tier { 
            font-size: 10px; 
            font-weight: 800; 
            padding: 4px 10px; 
            border-radius: 6px; 
            text-transform: uppercase; 
            display: inline-block; 
            margin-bottom: 8px; 
            letter-spacing: 0.5px; 
            width: fit-content;
        }
        .tier-pelajar { background: linear-gradient(135deg, #1d4ed8, #3b82f6); color: #ffffff; box-shadow: 0 4px 10px rgba(59, 130, 246, 0.2); }
        .tier-reguler { background: linear-gradient(135deg, #334155, #475569); color: #ffffff; box-shadow: 0 4px 10px rgba(100, 116, 139, 0.15); }
        .tier-premium { background: linear-gradient(135deg, #b45309, #eab308); color: #ffffff; box-shadow: 0 4px 10px rgba(234, 179, 8, 0.2); }

        .price-input-wrapper { position: relative; display: flex; align-items: center; width: 100%; }
        .price-input-wrapper::after { content: ".000"; position: absolute; right: 14px; color: #64748b; font-weight: bold; }
        
        #login-overlay { position: fixed; inset: 0; background: radial-gradient(circle at center, #0f172a, #020617); z-index: 9999; display: flex; align-items: center; justify-content: center; }
        
        /* Colored Animated Image Upload Box */
        .image-upload-box { 
            border: 2px dashed rgba(59, 130, 246, 0.3); 
            background: rgba(15, 23, 42, 0.4);
            border-radius: 0.75rem; 
            padding: 30px 24px; 
            text-align: center; 
            cursor: pointer; 
            transition: all 0.3s ease; 
        }
        .image-upload-box:hover { 
            border-color: #3b82f6; 
            background: rgba(59, 130, 246, 0.06); 
            transform: scale(1.005);
        }
        
        .preview-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 12px; margin-top: 12px; }
        .preview-wrapper { position: relative; border-radius: 0.5rem; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); }
        
        /* Mengubah gambar peninjau pasang dan edit agar full size tidak dipotong */
        .preview-wrapper img { width: 100%; height: auto; object-fit: contain; display: block; }
        
        .remove-img-btn { position: absolute; top: 4px; right: 4px; background: #ef4444; color: white; width: 20px; height: 20px; border-radius: 50%; font-size: 11px; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; z-index: 20; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }

        .is-sold-card .stok-img { filter: grayscale(0.9) brightness(0.3); }

        .sold-label { 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%) rotate(-12deg);
            border: 2px solid #ef4444;
            color: #ef4444;
            font-weight: 900;
            font-size: 16px;
            padding: 6px 16px;
            letter-spacing: 3px;
            white-space: nowrap;
            z-index: 10;
            background: rgba(3, 7, 18, 0.9);
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            pointer-events: none;
        }

        #edit-modal { position: fixed; inset: 0; background: rgba(2, 6, 23, 0.8); z-index: 10000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(12px); }
        .modal-content { background: #070c19; border: 1px solid rgba(255,255,255,0.08); border-radius: 1.5rem; width: 92%; max-width: 520px; max-height: 85vh; overflow-y: auto; padding: 2rem; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6); }
        
        /* Stylized Pin Input fields */
        .pin-field {
            letter-spacing: 1.5rem;
            text-align: center;
            font-size: 24px;
            font-weight: 800;
            padding-left: 1.5rem;
        }
    </style>
</head>
<body class="pb-12 bg-[#030712]">

    <div id="login-overlay">
        <div class="admin-card p-8 w-full max-w-md mx-5 animate__animated animate__fadeInDown">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-blue-500/10 border border-blue-500/20 rounded-2xl flex items-center justify-center mx-auto mb-4 text-blue-400 shadow-lg shadow-blue-500/5">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                    </svg>
                </div>
                <h1 class="text-2xl font-extrabold tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-indigo-400">ACELIS MARKET</h1>
                <p class="text-slate-400 text-xs mt-1.5">Masukkan PIN Keamanan Admin</p>
            </div>
            <div class="space-y-5">
                <div>
                    <input type="password" id="admin-pin" maxlength="6" placeholder="******" class="input-field pin-field" autocomplete="off">
                </div>
                <button onclick="checkAuth()" class="w-full bg-blue-600 hover:bg-blue-700 py-3.5 rounded-xl font-bold transition-all flex items-center justify-center gap-2 shadow-lg shadow-blue-600/15 active:scale-[0.99] text-sm tracking-wide">
                    Verifikasi PIN
                </button>
            </div>
            <p id="error-msg" class="text-red-400 text-xs mt-4 text-center hidden font-medium flex items-center justify-center gap-1.5">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
                PIN yang dimasukkan salah.
            </p>
        </div>
    </div>

    <div id="admin-content" class="hidden">
        <div class="px-4 mt-10 space-y-12 max-w-6xl mx-auto">
            
            <!-- SINKRONISASI NAMA ADMIN -->
            <section class="animate__animated animate__fadeInUp">
                <div class="flex items-center gap-3 mb-6">
                    <div class="w-1.5 h-6 bg-indigo-500 rounded-full shadow-md shadow-indigo-500/40"></div>
                    <h3 class="font-bold text-lg tracking-wide text-slate-200">Pengaturan Profil Admin</h3>
                </div>
                <div class="admin-card p-6 sm:p-8 grid grid-cols-1 gap-4">
                    <div>
                        <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1.5 block">Pilih Nama Admin</label>
                        <select id="admin-profile-name" class="input-field appearance-none cursor-pointer">
                            <option value="AK ACELIS">AK ACELIS</option>
                            <option value="AK DAFA">AK DAFA</option>
                        </select>
                    </div>
                    <div class="pt-2">
                        <button onclick="saveAdminProfile()" class="w-full bg-indigo-600 hover:bg-indigo-700 py-3.5 rounded-xl font-bold text-xs uppercase tracking-widest transition-all shadow-lg active:scale-[0.99]">Simpan & Sinkronkan Profil</button>
                    </div>
                </div>
            </section>

            <section class="animate__animated animate__fadeInUp" style="animation-delay: 0.1s;">
                <div class="flex items-center gap-3 mb-6">
                    <div class="w-1.5 h-6 bg-blue-500 rounded-full shadow-md shadow-blue-500/40"></div>
                    <h3 class="font-bold text-lg tracking-wide text-slate-200">Pasang Produk Baru</h3>
                </div>
                
                <div class="admin-card p-6 sm:p-8 space-y-6">
                    <div id="dynamic-form" class="space-y-4"></div>

                    <div class="image-upload-box" onclick="document.getElementById('file-input').click()">
                        <div class="flex flex-col items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-blue-400 mb-1" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                            </svg>
                            <p class="text-xs text-slate-300 font-bold uppercase tracking-wider">Tap untuk Upload Gambar</p>
                        </div>
                        <input type="file" id="file-input" accept="image/*" multiple class="hidden" onchange="handleFileSelect(this, 'create')">
                    </div>
                    <div id="preview-container" class="preview-container"></div>
                    
                    <button id="publish-btn" onclick="publishItem()" class="w-full bg-blue-600 py-4 rounded-xl font-bold text-xs uppercase tracking-widest hover:bg-blue-700 transition-all shadow-lg shadow-blue-950/20 active:scale-[0.99] mt-2">Publish Item</button>
                </div>
            </section>

            <section class="animate__animated animate__fadeInUp" style="animation-delay: 0.2s;">
                <div class="flex items-center gap-3 mb-6">
                    <div class="w-1.5 h-6 bg-emerald-500 rounded-full shadow-md shadow-emerald-500/40"></div>
                    <h3 class="font-bold text-lg tracking-wide text-slate-200">Daftar Katalog Produk</h3>
                </div>
                <div id="stok-container" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 sm:gap-5"></div>
            </section>
        </div>
    </div>

    <div id="edit-modal">
        <div class="modal-content animate__animated animate__zoomIn">
            <div class="flex justify-between items-center mb-6 border-b border-slate-800/60 pb-3">
                <h3 class="text-lg font-bold text-blue-400 tracking-wide flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" /></svg>
                    Edit Data Produk
                </h3>
                <button onclick="closeEditModal()" class="text-slate-400 hover:text-white text-2xl transition-colors">&times;</button>
            </div>
            <div id="edit-form-container" class="space-y-4"></div>
            <div class="mt-6 flex gap-3 pt-4 border-t border-slate-800/60">
                <button onclick="closeEditModal()" class="flex-1 bg-slate-900 hover:bg-slate-800 border border-slate-800 py-3 rounded-xl font-medium text-sm text-slate-300 transition-colors">Batal</button>
                <button onclick="saveEdit()" class="flex-1 bg-blue-600 hover:bg-blue-700 py-3 rounded-xl font-bold text-sm transition-all shadow-md shadow-blue-950/20">Simpan Perubahan</button>
            </div>
        </div>
    </div>

    <script>
        let currentType = 'katalog';
        let tempImages = [];
        let editTempImages = [];
        let editingItem = null;
        
        let produkKatalog = JSON.parse(localStorage.getItem('produkAcelis')) || [];

        // Check PIN Security Authentication (170211)
        function checkAuth() {
            const inputPin = document.getElementById('admin-pin').value;
            if (inputPin === "170211") {
                document.getElementById('login-overlay').style.className = "animate__animated animate__fadeOut";
                setTimeout(() => {
                    document.getElementById('login-overlay').style.display = 'none';
                    document.getElementById('admin-content').classList.remove('hidden');
                    loadAdminProfile();
                    switchForm('katalog');
                    renderStok();
                }, 300);
            } else {
                const errorEl = document.getElementById('error-msg');
                errorEl.classList.remove('hidden');
                errorEl.classList.add('animate__animated', 'animate__shakeX');
                document.getElementById('admin-pin').value = "";
                setTimeout(() => errorEl.classList.remove('animate__shakeX'), 500);
            }
        }

        // Auto trigger input password login focusing
        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('admin-pin').focus();
        });

        // Fungsi Memuat Data Profil Admin Saat Berhasil Login
        function loadAdminProfile() {
            const profileData = JSON.parse(localStorage.getItem('profilAdminAcelis')) || { nama: 'AK ACELIS', foto: '' };
            document.getElementById('admin-profile-name').value = profileData.nama || 'AK ACELIS';
        }

        // Fungsi Mengemas dan Sinkronisasi Profil Admin & Nama Penjual di Seluruh Katalog ke Mode Tamu
        function saveAdminProfile() {
            const namaSelect = document.getElementById('admin-profile-name').value;

            const profileObj = {
                nama: namaSelect,
                foto: "" 
            };

            localStorage.setItem('profilAdminAcelis', JSON.stringify(profileObj));

            // SINKRONISASI WAJIB: Perbarui seluruh properti nama penjual di database produk lokal agar sinkron di mode tamu
            produkKatalog = produkKatalog.map(item => {
                return { ...item, penjual: namaSelect };
            });
            localStorage.setItem('produkAcelis', JSON.stringify(produkKatalog));
            
            renderStok();
            alert("Profil Admin dan Nama Penjual di seluruh katalog berhasil disinkronkan ke mode tamu!");
        }

        function switchForm(type) {
            currentType = type;
            const container = document.getElementById('dynamic-form');
            
            container.innerHTML = `
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1.5 block">Nama Produk</label>
                        <input type="text" id="item-name" placeholder="Masukkan nama produk..." class="input-field">
                    </div>
                    <div>
                        <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1.5 block">Harga Produk</label>
                        <div class="price-input-wrapper">
                            <input type="number" id="item-price" placeholder="Contoh: 150" class="input-field pr-14">
                        </div>
                    </div>
                    <div>
                        <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1.5 block">Pilih Game</label>
                        <select id="item-game" class="input-field appearance-none cursor-pointer">
                            <option>Free Fire</option>
                            <option>Mobile Legends</option>
                            <option>eFootball</option>
                            <option>PUBG Mobile</option>
                            <option>Roblox</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1.5 block">Tier Akun</label>
                        <select id="item-tier" class="input-field appearance-none cursor-pointer">
                            <option value="pelajar">Pelajar</option>
                            <option value="reguler">Reguler</option>
                            <option value="premium">Premium</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1.5 block">Deskripsi Detail</label>
                    <textarea id="item-desc" rows="3" placeholder="Tuliskan spesifikasi detail produk di sini..." class="input-field"></textarea>
                </div>`;
        }

        async function compressImage(base64Str) {
            return new Promise((resolve) => {
                const img = new Image();
                img.src = base64Str;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800;
                    let width = img.width;
                    let height = img.height;
                    if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', 0.7));
                };
            });
        }

        async function handleFileSelect(input, mode) {
            const files = Array.from(input.files);
            for (const file of files) {
                const reader = new FileReader();
                const result = await new Promise((resolve) => {
                    reader.onload = (e) => resolve(e.target.result);
                    reader.readAsDataURL(file);
                });
                const compressed = await compressImage(result);
                if(mode === 'create') {
                    tempImages.push(compressed);
                    updatePreview();
                } else {
                    editTempImages.push(compressed);
                    updateEditPreview();
                }
            }
            input.value = ""; 
        }

        function updatePreview() {
            const container = document.getElementById('preview-container');
            container.innerHTML = "";
            tempImages.forEach((imgSrc, index) => {
                const wrapper = document.createElement('div');
                wrapper.className = "preview-wrapper animate__animated animate__fadeIn";
                wrapper.innerHTML = `<div class="remove-img-btn" onclick="removeImage(${index})">✕</div><img src="${imgSrc}">`;
                container.appendChild(wrapper);
            });
        }

        function updateEditPreview() {
            const container = document.getElementById('edit-preview-container');
            container.innerHTML = "";
            editTempImages.forEach((imgSrc, index) => {
                const wrapper = document.createElement('div');
                wrapper.className = "preview-wrapper animate__animated animate__fadeIn";
                wrapper.innerHTML = `<div class="remove-img-btn" onclick="removeEditImage(${index})">✕</div><img src="${imgSrc}">`;
                container.appendChild(wrapper);
            });
        }

        function removeImage(index) { tempImages.splice(index, 1); updatePreview(); }
        function removeEditImage(index) { editTempImages.splice(index, 1); updateEditPreview(); }

        function publishItem() {
            const nameEl = document.getElementById('item-name');
            const descEl = document.getElementById('item-desc');
            const tierEl = document.getElementById('item-tier');
            const priceInput = document.getElementById('item-price');

            if(!nameEl.value) return alert("Nama harus diisi!");
            if(tempImages.length === 0) return alert("Minimal upload 1 foto!");
            if(!priceInput.value) return alert("Harga belum diisi!");

            // Ambil nama admin aktif dari elemen pilihan untuk dimasukkan sebagai pengenal penjual
            const currentAdminName = document.getElementById('admin-profile-name').value;

            let itemData = {
                id: Date.now(),
                nama: nameEl.value,
                deskripsi: descEl.value,
                images: [...tempImages],
                tier: tierEl.value,
                status: 'ready',
                harga: "Rp " + priceInput.value + ".000",
                kategori: document.getElementById('item-game').value,
                penjual: currentAdminName // Menambahkan properti penjual agar langsung sinkron saat dibuat
            };

            produkKatalog.unshift(itemData);
            localStorage.setItem('produkAcelis', JSON.stringify(produkKatalog));

            tempImages = [];
            updatePreview();
            nameEl.value = ""; descEl.value = ""; priceInput.value = "";
            renderStok();
            alert("Berhasil Terpasang!");
        }

        function renderStok() {
            const container = document.getElementById('stok-container');
            container.innerHTML = "";
            const allItems = [...produkKatalog];
            allItems.sort((a,b) => b.id - a.id);
            if (allItems.length === 0) {
                container.innerHTML = '<p class="text-slate-500 italic text-sm col-span-full text-center py-12">Belum ada stok produk yang terpasang.</p>';
                return;
            }
            allItems.forEach(item => {
                const isSold = item.status === 'sold' || item.status === 'terjual';
                const div = document.createElement('div');
                div.className = `product-card-preview animate__animated animate__fadeIn ${isSold ? 'is-sold-card' : ''}`;
                
                let soldBtnText = isSold ? 'BUKA STOK' : 'SOLD OUT';
                let soldBtnColor = isSold ? 'bg-emerald-600 hover:bg-emerald-700' : 'bg-rose-600 hover:bg-rose-700';
                
                let priceDisplayHtml = `<span class="stok-price">${item.harga}</span>`;

                div.innerHTML = `
                    <div class="stok-img-wrapper">
                        ${isSold ? `<div class="sold-label">TERJUAL</div>` : ''}
                        <img src="${item.images[0]}" class="stok-img">
                    </div>
                    <div class="stok-info border-t border-slate-800/40">
                        <span class="badge-tier tier-${item.tier}">${item.tier}</span>
                        <h4 class="stok-title truncate" title="${item.nama}">${item.nama}</h4>
                        ${priceDisplayHtml}
                        <div class="flex flex-col gap-2 mt-auto">
                            <button onclick="toggleSold(${item.id})" class="w-full ${soldBtnColor} text-[11px] font-bold py-2.5 rounded-xl transition-all shadow-md tracking-wider text-white">${soldBtnText}</button>
                            <div class="grid grid-cols-2 gap-2">
                                <button onclick="openEditModal(${item.id})" class="bg-blue-500/10 hover:bg-blue-500/20 text-blue-400 font-bold py-2 rounded-xl text-[10px] border border-blue-500/20 transition-colors uppercase tracking-wider">EDIT</button>
                                <button onclick="deleteItem(${item.id})" class="bg-red-500/10 hover:bg-red-500/20 text-red-400 font-bold py-2 rounded-xl text-[10px] border border-red-500/20 transition-colors uppercase tracking-wider">HAPUS</button>
                            </div>
                        </div>
                    </div>`;
                container.appendChild(div);
            });
        }

        function openEditModal(id) {
            const item = produkKatalog.find(p => p.id === id);
            editingItem = item;
            editTempImages = [...item.images];
            
            // Mengambil data spesifik penjual pada item tersebut, jika kosong pakai profil global default
            const currentItemSeller = item.penjual || (JSON.parse(localStorage.getItem('profilAdminAcelis')) || { nama: 'AK ACELIS' }).nama;

            const container = document.getElementById('edit-form-container');
            const currentMainPrice = item.harga.replace(/[^0-9]/g, '').slice(0, -3);

            let formHtml = `
                <div class="space-y-4 text-left">
                    <!-- BAGIAN ATUR & SINKRONKAN PROFIL ADMIN DALAM MODAL -->
                    <div class="bg-indigo-950/30 border border-indigo-500/10 p-3.5 rounded-xl space-y-3 mb-4">
                        <h4 class="text-xs font-bold text-indigo-400 tracking-wider uppercase flex items-center gap-1.5">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
                            Pengaturan Penjual / Admin
                        </h4>
                        <div>
                            <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1 block">Pilih Nama Penjual</label>
                            <select id="modal-admin-name" class="input-field py-2 text-xs appearance-none cursor-pointer">
                                <option value="AK ACELIS" ${currentItemSeller === 'AK ACELIS' ? 'selected' : ''}>AK ACELIS</option>
                                <option value="AK DAFA" ${currentItemSeller === 'AK DAFA' ? 'selected' : ''}>AK DAFA</option>
                            </select>
                        </div>
                    </div>

                    <!-- DATA PRODUK -->
                    <div>
                        <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1 block">Nama Item</label>
                        <input type="text" id="edit-nama" value="${item.nama}" class="input-field">
                    </div>
                    <div>
                        <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1 block">Harga (Angka saja)</label>
                        <div class="price-input-wrapper">
                            <input type="number" id="edit-harga" value="${currentMainPrice}" class="input-field pr-14">
                        </div>
                    </div>
                    <div>
                        <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1 block">Tier Akun</label>
                        <select id="edit-tier" class="input-field appearance-none cursor-pointer">
                            <option value="pelajar" ${item.tier === 'pelajar' ? 'selected' : ''}>Pelajar</option>
                            <option value="reguler" ${item.tier === 'reguler' ? 'selected' : ''}>Reguler</option>
                            <option value="premium" ${item.tier === 'premium' ? 'selected' : ''}>Premium</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1 block">Deskripsi Detail</label>
                        <textarea id="edit-desc" rows="3" class="input-field">${item.deskripsi}</textarea>
                    </div>
                    <div>
                        <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1 block">Kelola Foto Produk</label>
                        <div class="image-upload-box py-3.5 mb-2" onclick="document.getElementById('edit-file-input').click()">
                            <p class="text-[11px] text-blue-400 font-bold uppercase tracking-wide flex items-center justify-center gap-1">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
                                Tambah Foto Baru
                            </p>
                            <input type="file" id="edit-file-input" accept="image/*" multiple class="hidden" onchange="handleFileSelect(this, 'edit')">
                        </div>
                        <div id="edit-preview-container" class="preview-container"></div>
                    </div>
                </div>`;
            container.innerHTML = formHtml;
            updateEditPreview();
            document.getElementById('edit-modal').style.display = 'flex';
        }

        function closeEditModal() { document.getElementById('edit-modal').style.display = 'none'; editingItem = null; }

        function saveEdit() {
            if(!editingItem) return;
            if(editTempImages.length === 0) return alert("Minimal harus ada 1 foto!");
            
            // Simpan perubahan nama admin / penjual yang diatur dari modal
            const modalAdminName = document.getElementById('modal-admin-name').value;
            const updatedAdminProfile = {
                nama: modalAdminName,
                foto: ""
            };
            localStorage.setItem('profilAdminAcelis', JSON.stringify(updatedAdminProfile));
            
            // Perbarui visualisasi elemen pilihan admin di halaman utama agar ikut tersinkronisasi
            loadAdminProfile();

            // Simpan perubahan data produk beserta pembaruan field 'penjual' agar wajib sinkron ke mode tamu
            const newNama = document.getElementById('edit-nama').value;
            const newTier = document.getElementById('edit-tier').value;
            const newDesc = document.getElementById('edit-desc').value;
            const newHargaRaw = document.getElementById('edit-harga').value;

            // Meng-update data dan juga menyinkronkan field 'penjual' pada produk spesifik ini
            produkKatalog = produkKatalog.map(item => item.id === editingItem.id ? { 
                ...item, 
                nama: newNama, 
                harga: "Rp " + newHargaRaw + ".000", 
                tier: newTier, 
                deskripsi: newDesc, 
                images: [...editTempImages],
                penjual: modalAdminName // WAJIB SINKRON: memperbarui nama penjual di produk terkait
            } : item);
            
            localStorage.setItem('produkAcelis', JSON.stringify(produkKatalog));
            
            renderStok(); closeEditModal(); alert("Perubahan produk dan sinkronisasi nama penjual berhasil disimpan!");
        }

        function toggleSold(id) {
            produkKatalog = produkKatalog.map(item => { if(item.id === id) item.status = (item.status === 'sold' || item.status === 'terjual') ? 'ready' : 'sold'; return item; });
            localStorage.setItem('produkAcelis', JSON.stringify(produkKatalog));
            renderStok();
        }

        function deleteItem(id) {
            if(confirm("Hapus item ini selamanya?")) {
                produkKatalog = produkKatalog.filter(item => item.id !== id);
                localStorage.setItem('produkAcelis', JSON.stringify(produkKatalog));
                renderStok();
            }
        }
    </script>
</body>
</html>
